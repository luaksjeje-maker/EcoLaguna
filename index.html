<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLaguna</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <span>🌎</span> EcoLaguna
        </div>
        <p>Las capas de reciclaje, puntos limpios y basureros.</p>
    </header>

    <main>
        <aside>
            <label>
                <input type="checkbox" id="limpios" checked>
                🔵 Puntos limpios
            </label>

            <label>
                <input type="checkbox" id="basureros" checked>
                🗑️ Basureros
            </label>

            <hr>

            <h2>📍 Lugares</h2>

            <div id="lista-lugares">
                <p>Los lugares aparecerán aquí.</p>
            </div>

            <div class="mensaje">
                <b>¡Juntos cuidamos Laguna Chica!</b>
            </div>
        </aside>

        <section id="map"></section>
    </main>

    <div class="panel-ruta">
        <div class="ruta-titulo">📍 ¿Cómo llegar?</div>
        <p>Desde la entrada de la Laguna Chica hacia el sector seleccionado.</p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
